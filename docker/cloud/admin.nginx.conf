# HTTPS terminates at CloudFront/ALB; restrict direct origin access.
server {
    listen 8080;
    server_name _;
    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Keep a trailing slash so relative assets resolve under /staff/.
    location = /staff {
        absolute_redirect off;
        return 308 /staff/;
    }
    location ^~ /staff/ {
        rewrite ^/staff/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }
    location ~ \.js$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location /actuator/ { return 404; }
    location ~ ^/(admin/|session/|login$|logout$) {
        proxy_pass http://analytics:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}