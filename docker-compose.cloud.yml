# Standalone EC2/RDS cloud-test stack, not an override of docker-compose.yml.
# No demo SQL is applied. Hibernate update is for initial cloud testing only.
x-ca: &ca
  type: bind
  source: ${RDS_CA_BUNDLE:?Set path to downloaded RDS CA bundle}
  target: /certs/global-bundle.pem
  read_only: true
  bind:
    create_host_path: false
x-olap-db: &olap-db
  ANALYTICS_DB_URL: ${ANALYTICS_DB_URL:?Set Python OLAP RDS URL}
  ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:?Set OLAP role}
  ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set OLAP password}

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "orders.submitted", "--partitions", "1", "--replication-factor", "1"]
    restart: "no"

  olap-migrate:
    image: jarbis-analytics:cloud
    build: ./analytics-service
    command: ["python", "-m", "analytics.migrate"]
    environment: *olap-db
    volumes:
      - *ca
    restart: "no"

  analytics:
    image: jarbis-analytics:cloud
    build: ./analytics-service
    environment:
      <<: *olap-db
      ANALYTICS_ADMIN_USER: ${ANALYTICS_ADMIN_USER:-analyst}
      ANALYTICS_ADMIN_PASSWORD_HASH: ${ANALYTICS_ADMIN_PASSWORD_HASH:?Set analyst BCrypt hash}
      ANALYTICS_OPERATIONS_USER: ${ANALYTICS_OPERATIONS_USER:-operations}
      ANALYTICS_OPERATIONS_PASSWORD_HASH: ${ANALYTICS_OPERATIONS_PASSWORD_HASH:?Set operations BCrypt hash}
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:?Set HTTPS admin origin}
      ANALYTICS_SECURE_COOKIE: "true"
    volumes:
      - *ca
    depends_on:
      olap-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/actuator/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  jarbis-backend:
    build: .
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: ${BROKERAGE_DB_URL:?Set JDBC OLTP RDS URL}
      SPRING_DATASOURCE_USERNAME: ${BROKERAGE_DB_USER:?Set OLTP role}
      SPRING_DATASOURCE_PASSWORD: ${BROKERAGE_DB_PASSWORD:?Set OLTP password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      # Creates mapped tables in an already-created database; not production migrations.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      BROKERAGE_ANALYTICS_ENABLED: "true"
      BROKERAGE_ANALYTICS_DB_URL: ${BROKERAGE_ANALYTICS_DB_URL:?Set JDBC OLAP RDS URL}
      BROKERAGE_ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:?Set OLAP role}
      BROKERAGE_ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set OLAP password}
      BROKERAGE_ANALYTICS_SERVICE_URL: http://analytics:8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_CONSUMER_GROUP_ID: jarbis-backend
      BROKERAGE_KAFKA_TOPICS_ORDER_SUBMITTED: orders.submitted
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      JWT_SECRET: ${JWT_SECRET:?Set cryptographically random JWT secret}
      JWT_EXPIRATION_MS: "3600000"
      JWT_REFRESH_COOKIE_SECURE: "true"
      BROKERAGE_MARKET_DATA_POLLING_ENABLED: ${BROKERAGE_MARKET_DATA_POLLING_ENABLED:-false}
      BROKERAGE_MARKET_DATA_BASE_URL: ${BROKERAGE_MARKET_DATA_BASE_URL:?Set provider URL}
      BROKERAGE_MARKET_DATA_API_KEY: ${BROKERAGE_MARKET_DATA_API_KEY:-}
      BROKERAGE_MARKET_DATA_POLLING_API_KEY: ${BROKERAGE_MARKET_DATA_POLLING_API_KEY:-${BROKERAGE_MARKET_DATA_API_KEY:-}}
      BROKERAGE_MARKET_DATA_CANDLES_API_KEY: ${BROKERAGE_MARKET_DATA_CANDLES_API_KEY:-${BROKERAGE_MARKET_DATA_API_KEY:-}}
      # Demo-only synthetic sell liquidity; keep disabled outside demos.
      BROKERAGE_SETTLEMENT_LIQUIDITY_BACKSTOP_ENABLED: ${BROKERAGE_SETTLEMENT_LIQUIDITY_BACKSTOP_ENABLED:-false}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      LOGGING_LEVEL_ROOT: INFO
    volumes:
      - *ca
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      olap-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  client:
    build: ./client
    environment:
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN:-}
    volumes:
      - ./docker/cloud/client.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # EC2 security group must allow this port ONLY from the HTTPS ALB.
    ports:
      - "8095:80"
    depends_on:
      jarbis-backend:
        condition: service_healthy
    restart: unless-stopped

  admin-ui:
    build: ./admin-ui
    volumes:
      - ./docker/cloud/admin.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:8080"
    depends_on:
      analytics:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  kafka_data: