spring.config.import=optional:file:.env[.properties]
spring.application.name=trading-platform

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jarbis
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=n3u3d4!

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8081

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=jarbis-settlement-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
brokerage.kafka.topics.order-submitted=orders.submitted

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Fauxnance market data configuration
brokerage.market-data.base-url=https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1
brokerage.market-data.api-key=${BROKERAGE_MARKET_DATA_API_KEY:}
brokerage.market-data.batch-size=25
brokerage.market-data.polling.enabled=false
brokerage.market-data.polling.fixed-delay-ms=15000
brokerage.market-data.redis.key-prefix=market-data:
brokerage.market-data.redis.retention-window=7d
