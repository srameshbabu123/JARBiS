spring.application.name=jarbis-analytics
server.port=8082
spring.datasource.url=${ANALYTICS_DB_URL:jdbc:postgresql://localhost:8091/jarbis_olap}
spring.datasource.username=${ANALYTICS_DB_USER:jarbis_olap_user}
spring.datasource.password=${ANALYTICS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '10s'
spring.flyway.default-schema=reporting_migrations
spring.flyway.create-schemas=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=jarbis-analytics-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${ANALYTICS_INGESTION_ENABLED:true}
analytics.topic=trading.settled.v1
analytics.username=${ANALYTICS_ADMIN_USER:admin}
analytics.password-hash=${ANALYTICS_ADMIN_PASSWORD_HASH}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${ANALYTICS_SECURE_COOKIE:false}
management.endpoints.web.exposure.include=health
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
