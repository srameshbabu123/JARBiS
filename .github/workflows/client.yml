name: Client and Java integration
on:
  pull_request:
    paths: ['client/**', 'src/**', 'pom.xml', '.github/workflows/client.yml']
  push:
    branches: ['development', 'feature/client-backend-integration']
    paths: ['client/**', 'src/**', 'pom.xml', '.github/workflows/client.yml']
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start disposable PostgreSQL for transaction regression tests
        shell: bash
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          docker run -d --name client-route-postgres \
            -e POSTGRES_USER=route_test -e POSTGRES_DB=route_test \
            -e POSTGRES_PASSWORD="$test_password" \
            -p 127.0.0.1::5432 postgres:15-alpine
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec client-route-postgres pg_isready -h 127.0.0.1 -U route_test -d route_test; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test_port="$(docker port client-route-postgres 5432/tcp | cut -d: -f2)"
          echo "JARBIS_TEST_POSTGRES_URL=jdbc:postgresql://127.0.0.1:$test_port/route_test" >> "$GITHUB_ENV"
          echo "JARBIS_TEST_POSTGRES_USER=route_test" >> "$GITHUB_ENV"
          echo "JARBIS_TEST_POSTGRES_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - run: mvn --batch-mode test
      - name: Remove disposable test database
        if: always()
        run: docker rm -f -v client-route-postgres || true
